<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="color-scheme" content="dark"/>
<title>Bookshelf</title>
<style>
:root{
--s:#202622;
--in:#161a17;
--bd:rgba(158,131,110,.24);
--bg2:rgba(107,140,119,.3);
--g1:#2e4236;
--g2:#456652;
--g3:#6b8f78;
--tx:#eae5de;
--mt:#98928b;
--dn:#c97a72;
--gap:clamp(16px,3vw,24px)
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{
width:100%;
height:100%;
max-width:100%;
background:transparent!important;
color:var(--tx);
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
padding:clamp(4px,1vw,8px);
overflow:hidden
}
.w{
width:100%;
height:100%;
min-width:0;
min-height:0;
display:flex;
flex-direction:column;
border:1px solid var(--bd);
border-radius:clamp(12px,2vw,18px);
padding:clamp(16px,2.6vh,22px) clamp(14px,2vw,18px) clamp(12px,2vh,16px);
overflow:hidden
}
.top{
display:flex;
flex-wrap:wrap;
justify-content:space-between;
align-items:center;
gap:8px clamp(8px,1.2vw,14px);
flex-shrink:0;
margin-bottom:clamp(10px,1.8vh,16px)
}
.top>div:first-child{
min-width:0;
flex:1 1 170px
}
.w .tt{
font-size:clamp(24px,4vw,30px);
font-weight:700;
line-height:1.2;
letter-spacing:-0.015em;
color:var(--tx)
}
.sub{font-size:clamp(11px,1.6vw,12.5px);color:var(--mt);margin-top:3px}
.acts{
display:flex;
align-items:center;
justify-content:flex-end;
gap:clamp(8px,1.2vw,14px);
flex-shrink:0;
margin-left:auto
}
.fbox{
display:none;
align-items:center;
gap:6px;
height:clamp(32px,4vh,38px);
background:var(--in);
border:1px solid var(--g3);
border-radius:8px;
padding:0 8px
}
.fbox.open{display:inline-flex}
.fbox.below{
display:none;
width:100%;
flex-basis:100%;
margin-top:4px
}
.fbox.below.open{display:flex}
.fin{
flex:1 1 auto;
width:clamp(110px,15vw,175px);
min-width:0;
background:transparent;
border:none;
color:var(--tx);
font-size:12px;
outline:none;
padding:2px 0
}
.fbox.below .fin{width:100%}
.fin::placeholder{color:var(--mt)}
.fclr{
background:none;
border:none;
color:var(--mt);
font-size:14px;
line-height:1;
cursor:pointer;
padding:0 2px
}
.fclr:hover{color:var(--tx)}
.btn{
height:clamp(32px,4vh,38px);
display:inline-flex;
align-items:center;
justify-content:center;
text-align:center;
background:var(--s);
border:1px solid var(--bg2);
color:var(--tx);
font-size:clamp(12px,1.8vw,14px);
font-weight:400;
line-height:1;
padding:0 clamp(12px,1.6vw,16px);
border-radius:8px;
cursor:pointer;
white-space:nowrap;
flex-shrink:0
}
.btn:hover,.btn.act{background:var(--g1);border-color:var(--g3)}
.sh{
flex:1 1 auto;
min-height:0;
min-width:0;
width:100%;
display:flex;
flex-direction:row;
flex-wrap:nowrap;
align-items:center;
gap:var(--gap);
overflow-x:auto;
overflow-y:hidden;
scroll-behavior:smooth;
padding:clamp(4px,1vh,12px) 2px;
scrollbar-width:thin;
scrollbar-color:rgba(158,131,110,.25) transparent
}
.sh::-webkit-scrollbar{height:6px}
.sh::-webkit-scrollbar-thumb{background:rgba(158,131,110,.25);border-radius:999px}
.bk{
--cov-w:clamp(76px,15vw,160px);
width:var(--cov-w);
flex:0 0 var(--cov-w);
background:transparent;
display:flex;
flex-direction:column;
align-items:center;
gap:4px;
cursor:pointer
}
.cv{
width:100%;
aspect-ratio:108 / 156;
border-radius:clamp(6px,1.2vw,11px);
background:transparent;
border:1px solid var(--bd);
overflow:hidden;
display:flex;
align-items:center;
justify-content:center;
text-align:center;
padding:0;
transition:.15s
}
.bk:hover .cv{transform:translateY(-2px);border-color:var(--g3)}
.cv img{width:100%;height:100%;object-fit:cover;display:block;background:transparent}
.nc{font-size:clamp(9px,1.4vw,11.5px);color:var(--mt);word-break:break-word;padding:4px}
.bt{
width:100%;
font-size:clamp(10px,1.6vw,13px);
font-weight:600;
line-height:1.15;
text-align:center;
display:-webkit-box;
-webkit-line-clamp:2;
-webkit-box-orient:vertical;
overflow:hidden;
overflow-wrap:anywhere
}
.ba,.bn{
width:100%;
font-size:clamp(9px,1.4vw,11px);
text-align:center;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis
}
.ba{color:var(--mt)}
.bn{color:#cbb29d}
.emp{
width:100%;
min-height:44px;
display:flex;
align-items:center;
justify-content:center;
padding:8px 12px;
text-align:center;
color:var(--mt);
font-size:clamp(11px,1.8vw,13px);
border:1px dashed var(--bd);
border-radius:12px
}
.mb{
display:none;
position:fixed;
inset:0;
background:rgba(10,13,11,.82);
z-index:50;
align-items:center;
justify-content:center;
padding:10px
}
.mb.open{display:flex}
.md{
width:100%;
max-width:410px;
max-height:88vh;
overflow-y:auto;
background:#1a1f1c;
border:1px solid var(--bd);
border-radius:14px;
padding:14px;
display:flex;
flex-direction:column;
gap:9px
}
.mh{display:flex;justify-content:space-between;align-items:center}
.mti{font-size:14px;font-weight:700}
.xb{background:none;border:none;color:var(--mt);font-size:18px;cursor:pointer;padding:0 4px}
.xb:hover{color:var(--tx)}
.tbs{display:flex;gap:6px;flex-wrap:wrap}
.tb{
flex:1 1 110px;
padding:6px;
border-radius:8px;
border:1px solid var(--bd);
background:var(--in);
color:var(--mt);
font-size:12px;
font-weight:600;
cursor:pointer
}
.tb.act{background:var(--g1);border-color:var(--g3);color:var(--tx)}
.row{display:flex;gap:6px;flex-wrap:wrap}
.row .in{flex:1 1 140px;min-width:0}
.in,.ta{
width:100%;
min-width:0;
background:var(--in);
border:1px solid var(--bd);
border-radius:8px;
padding:7px 9px;
font-size:12px;
color:var(--tx);
outline:none
}
.ta{resize:vertical;min-height:60px;font-family:inherit}
.lb{font-size:11px;color:var(--mt);margin-bottom:3px;display:block}
.rl{display:flex;flex-direction:column;gap:6px;max-height:185px;overflow-y:auto;margin-top:6px}
.ri{
display:flex;
gap:8px;
align-items:center;
background:var(--s);
border:1px solid var(--bd);
border-radius:9px;
padding:6px;
cursor:pointer;
text-align:left;
width:100%
}
.ri:hover{border-color:var(--g3);background:var(--g1)}
.rt{width:32px;height:46px;border-radius:4px;object-fit:cover;background:var(--in);flex-shrink:0}
.rm{flex:1;min-width:0}
.rbt{font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rba{font-size:11px;color:var(--mt);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dt{display:flex;gap:10px;align-items:flex-start}
.dc{width:72px;height:106px;border-radius:7px;object-fit:cover;background:transparent;border:1px solid var(--bd);flex-shrink:0}
.ddt{font-size:14px;font-weight:700;overflow-wrap:anywhere}
.dda{font-size:11px;color:var(--mt);margin-top:2px;overflow-wrap:anywhere}
.mf{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:4px;flex-wrap:wrap}
.db{background:rgba(201,122,114,.14);border:1px solid rgba(201,122,114,.35);color:var(--dn);font-size:11px;font-weight:600;padding:5px 9px;border-radius:8px;cursor:pointer}
.sb{background:var(--g2);border:1px solid var(--g3);color:#f3f1ed;font-size:12px;font-weight:600;padding:6px 12px;border-radius:8px;cursor:pointer}
.msg{font-size:11px;color:var(--mt)}
</style>
</head>
<body>
<div class="w" id="w">
<div class="top" id="top">
<div id="hinfo"><div class="tt">Favorite Books</div><div class="sub" id="cnt">0 books</div></div>
<div class="acts" id="acts">
<div class="fbox" id="fbox">
<input class="fin" id="fi" type="text" placeholder="Filter library...">
<button class="fclr" id="fclr" title="Clear">×</button>
</div>
<button class="btn" id="fs">Search</button>
<button class="btn" id="oa">+ Add book</button>
</div>
</div>
<div class="sh" id="sh"></div>
</div>

<div class="mb" id="am"><div class="md">
<div class="mh"><div class="mti">Add Book</div><button class="xb" id="ca">×</button></div>
<div class="tbs"><button class="tb act" id="ts">Search API</button><button class="tb" id="tm">Manual / Cover</button></div>
<div id="ps">
<label class="lb">Title or author</label>
<div class="row"><input class="in" id="qi" placeholder="e.g. Dune, Murakami..."><button class="btn" id="qb">Find</button></div>
<div class="msg" id="qm" style="margin-top:5px"></div>
<div class="rl" id="qr"></div>
</div>
<div id="pm" style="display:none">
<div style="margin-bottom:6px"><label class="lb">Title *</label><input class="in" id="mt"></div>
<div style="margin-bottom:6px"><label class="lb">Author</label><input class="in" id="ma"></div>
<div style="margin-bottom:6px"><label class="lb">Cover URL</label><input class="in" id="mc" placeholder="https://..."></div>
<div style="margin-bottom:6px"><label class="lb">Upload cover</label><input type="file" id="mf" accept="image/*" style="font-size:11px;color:var(--mt);max-width:100%"></div>
<div><label class="lb">Annotation</label><textarea class="ta" id="mn"></textarea></div>
<div class="mf" style="margin-top:8px"><span class="msg" id="mm"></span><button class="sb" id="ms">Add</button></div>
</div>
</div></div>

<div class="mb" id="dm"><div class="md">
<div class="mh"><div class="mti">Note</div><button class="xb" id="cd">×</button></div>
<div class="dt"><img class="dc" id="dc" src="" alt=""><div style="flex:1;min-width:0"><div class="ddt" id="dt"></div><div class="dda" id="da"></div></div></div>
<div><label class="lb">Annotation</label><textarea class="ta" id="dn"></textarea></div>
<div><label class="lb">Cover URL</label><input class="in" id="dcu" placeholder="https://..."></div>
<div class="mf"><button class="db" id="ddel">Remove</button><button class="sb" id="ds">Save</button></div>
</div></div>

<script>
const K="notion_fav_bookshelf_v1",$=id=>document.getElementById(id);
let books=[],aid=null,up="",qFilter="";
const ld=()=>{try{const d=JSON.parse(localStorage.getItem(K)||"null");if(Array.isArray(d))books=d}catch(e){}};
const sv=()=>{try{localStorage.setItem(K,JSON.stringify(books))}catch(e){}};
const esc=s=>String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function placeFilterBox(){
const fbox=$("fbox"),top=$("top"),hinfo=$("hinfo"),acts=$("acts"),fs=$("fs");
if(!fbox.classList.contains("open")){fbox.classList.remove("below");return}
const topRect=top.getBoundingClientRect();
const hRect=hinfo.getBoundingClientRect();
const fsRect=fs.getBoundingClientRect();
const wrappedBelow=fsRect.top > hRect.bottom + 4;
const freeLeft=(fsRect.left - topRect.left) - 14;
const neededWidth=175;
const shouldBeBelow=wrappedBelow || freeLeft < neededWidth;
if(shouldBeBelow && !fbox.classList.contains("below")){
fbox.classList.add("below");
top.appendChild(fbox);
}else if(!shouldBeBelow && fbox.classList.contains("below")){
fbox.classList.remove("below");
acts.insertBefore(fbox,fs);
}
}
function ren(){
const sh=$("sh"),q=qFilter.trim().toLowerCase();
const list=q?books.filter(b=>[b.title,b.author,b.note].some(x=>String(x||"").toLowerCase().includes(q))):books;
$("cnt").textContent=q?`${list.length} of ${books.length} ${books.length===1?"book":"books"}`:`${books.length} ${books.length===1?"book":"books"}`;
sh.innerHTML="";
if(!books.length){sh.innerHTML='<div class="emp">Empty. Click "+ Add book".</div>';return}
if(!list.length){sh.innerHTML='<div class="emp">No matching books found.</div>';return}
list.forEach(b=>{
const card=document.createElement("div");card.className="bk";
const cv=document.createElement("div");cv.className="cv";
if(b.cover){const img=document.createElement("img");img.src=b.cover;img.alt=b.title;img.loading="lazy";img.onerror=()=>{img.remove();cv.innerHTML=`<div class="nc">${esc(b.title)}</div>`};cv.appendChild(img)}
else cv.innerHTML=`<div class="nc">${esc(b.title)}</div>`;
const t=document.createElement("div");t.className="bt";t.textContent=b.title;card.append(cv,t);
if(b.author){const a=document.createElement("div");a.className="ba";a.textContent=b.author;card.appendChild(a)}
if(b.note){const n=document.createElement("div");n.className="bn";n.textContent="✎ "+b.note;card.appendChild(n)}
card.onclick=()=>openDet(b.id);sh.appendChild(card);
});
}
$("sh").addEventListener("wheel",e=>{if(Math.abs(e.deltaY)>Math.abs(e.deltaX)){e.currentTarget.scrollLeft+=e.deltaY;e.preventDefault()}},{passive:false});
$("fs").onclick=()=>{
const open=!$("fbox").classList.contains("open");
$("fbox").classList.toggle("open",open);
$("fs").classList.toggle("act",open);
if(open){placeFilterBox();$("fi").focus()}
else{qFilter="";$("fi").value="";$("fbox").classList.remove("below");$("acts").insertBefore($("fbox"),$("fs"));ren()}
};
$("fi").oninput=e=>{qFilter=e.target.value;ren()};
$("fclr").onclick=()=>{qFilter="";$("fi").value="";ren();$("fi").focus()};
if(window.ResizeObserver){new ResizeObserver(placeFilterBox).observe($("w"))}
window.addEventListener("resize",placeFilterBox);
function setTab(m){const s=m==="search";$("ts").classList.toggle("act",s);$("tm").classList.toggle("act",!s);$("ps").style.display=s?"block":"none";$("pm").style.display=s?"none":"block"}
$("oa").onclick=()=>{up="";$("mm").textContent="";$("am").classList.add("open");$("qi").focus()};
$("ca").onclick=()=>$("am").classList.remove("open");
$("ts").onclick=()=>setTab("search");$("tm").onclick=()=>setTab("manual");
const sG=async q=>{const r=await fetch(`https://www.googleapis.com/books/v1/volumes?q=${encodeURIComponent(q)}&maxResults=8`);if(!r.ok)throw 0;const d=await r.json();return(d.items||[]).map(it=>{const v=it.volumeInfo||{};return{title:v.title||"Untitled",author:(v.authors||[]).join(", "),cover:((v.imageLinks&&(v.imageLinks.thumbnail||v.imageLinks.smallThumbnail))||"").replace(/^http:/,"https:")}})};
const sO=async q=>{const r=await fetch(`https://openlibrary.org/search.json?q=${encodeURIComponent(q)}&limit=8`);if(!r.ok)throw 0;const d=await r.json();return(d.docs||[]).map(x=>({title:x.title||"Untitled",author:(x.author_name||[]).slice(0,2).join(", "),cover:x.cover_i?`https://covers.openlibrary.org/b/id/${x.cover_i}-M.jpg`:""}))};
function showResults(list,srcLabel){
$("qm").textContent=`${srcLabel}: click to add`;
list.forEach(b=>{
const row=document.createElement("button");row.className="ri";
row.innerHTML=`<img class="rt" src="${esc(b.cover)}" onerror="this.style.visibility='hidden'"/><div class="rm"><div class="rbt">${esc(b.title)}</div><div class="rba">${esc(b.author||"Unknown author")}</div></div>`;
row.onclick=()=>{
const note=prompt(`Note for "${b.title}":`)||"";
books.unshift({id:"b"+Date.now()+Math.random().toString(36).slice(2,5),title:b.title,author:b.author,cover:b.cover,note:note.trim()});
sv();ren();$("am").classList.remove("open");
};
$("qr").appendChild(row);
});
}
async function findB(){
const q=$("qi").value.trim();if(!q)return;$("qm").textContent="Searching...";$("qr").innerHTML="";
try{const r=await sG(q);if(r.length){showResults(r,"Google");return}}catch(e){}
try{const r=await sO(q);if(r.length){showResults(r,"OpenLib");return}$("qm").textContent="Not found. Use Manual."}catch(e){$("qm").textContent="API blocked. Use Manual."}
}
$("qb").onclick=findB;$("qi").onkeydown=e=>{if(e.key==="Enter")findB()};
$("mf").onchange=e=>{
const f=e.target.files&&e.target.files[0];if(!f)return;const rd=new FileReader();
rd.onload=ev=>{const im=new Image();im.onload=()=>{const c=document.createElement("canvas"),rt=Math.min(220/im.width,330/im.height,1);c.width=Math.round(im.width*rt);c.height=Math.round(im.height*rt);const ctx=c.getContext("2d");ctx.clearRect(0,0,c.width,c.height);ctx.drawImage(im,0,0,c.width,c.height);up=c.toDataURL("image/png");$("mc").value="[Uploaded image]"};im.src=ev.target.result};
rd.readAsDataURL(f);
};
$("ms").onclick=()=>{
const title=$("mt").value.trim();if(!title){$("mm").textContent="Enter title.";return}
books.unshift({id:"b"+Date.now(),title,author:$("ma").value.trim(),cover:up||$("mc").value.trim(),note:$("mn").value.trim()});
sv();ren();$("mt").value="";$("ma").value="";$("mc").value="";$("mn").value="";$("mf").value="";up="";$("am").classList.remove("open");
};
function openDet(id){
const b=books.find(x=>x.id===id);if(!b)return;aid=id;
$("dt").textContent=b.title;$("da").textContent=b.author||"";$("dn").value=b.note||"";
$("dcu").value=b.cover&&!b.cover.startsWith("data:")?b.cover:"";$("dc").src=b.cover||"";$("dm").classList.add("open");
}
$("cd").onclick=()=>$("dm").classList.remove("open");
$("ds").onclick=()=>{const b=books.find(x=>x.id===aid);if(!b)return;b.note=$("dn").value.trim();const nc=$("dcu").value.trim();if(nc)b.cover=nc;sv();ren();$("dm").classList.remove("open")};
$("ddel").onclick=()=>{books=books.filter(x=>x.id!==aid);sv();ren();$("dm").classList.remove("open")};
ld();ren();
</script>
</body>
</html>
