<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="color-scheme" content="dark"/>
<title>Embed Button</title>
<style>
:root{
--s:#202320;
--in:#161715;
--bd:rgba(158,131,110,.24);
--bg2:rgba(107,140,119,.30);
--g1:#2a3a30;
--g2:#3f5c4b;
--g3:#6b8f78;
--btn-bg:#352a22;
--btn-bg-h:#47382d;
--btn-bd:rgba(176,142,114,.38);
--btn-bd-h:rgba(203,178,157,.65);
--tx:#eae5de;
--mt:#9d958c;
--ac:#cbb29d;
--dn:#c97a72
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{
width:100%;
height:100%;
max-width:100%;
background:transparent!important;
color:var(--tx);
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
overflow:hidden
}
.root{
width:100%;
height:100%;
min-width:0;
min-height:0;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
background:transparent;
padding:6px;
overflow:hidden
}
.root.has-expanded{
justify-content:flex-start
}
.row-top{
display:inline-flex;
align-items:center;
justify-content:center;
gap:8px;
flex-shrink:0;
max-width:100%
}
.btn-wrap{
position:relative;
display:inline-flex;
align-items:center;
justify-content:center;
max-width:100%
}
.ebtn{
width:150px;
height:36px;
min-width:68px;
min-height:26px;
max-width:calc(100vw - 56px);
max-height:140px;
padding:0 14px;
font-size:13.5px;
display:inline-flex;
align-items:center;
justify-content:center;
background:var(--btn-bg);
border:1px solid var(--btn-bd);
color:var(--tx);
font-weight:400;
line-height:1.1;
border-radius:9px;
cursor:pointer;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;
user-select:none;
transition:background .15s,border-color .15s
}
.ebtn:hover{
background:var(--btn-bg-h);
border-color:var(--btn-bd-h)
}
/* Ручки ресайзу самої кнопки (активні у режимі налаштування) */
.rh{
display:none;
position:absolute;
z-index:5;
user-select:none;
touch-action:none
}
.btn-wrap.editing .rh{display:block}
.btn-wrap.editing .ebtn{
outline:1px dashed rgba(203,178,157,.65);
outline-offset:2px
}
.rh-r{
top:3px;
right:-4px;
width:8px;
height:calc(100% - 6px);
cursor:ew-resize
}
.rh-b{
bottom:-4px;
left:3px;
width:calc(100% - 6px);
height:8px;
cursor:ns-resize
}
.rh-br{
right:-5px;
bottom:-5px;
width:11px;
height:11px;
cursor:nwse-resize;
border-radius:3px;
background:var(--ac);
border:1px solid var(--in)
}
.gear-btn{
width:28px;
height:28px;
display:inline-flex;
align-items:center;
justify-content:center;
background:transparent;
border:none;
color:var(--mt);
border-radius:7px;
cursor:pointer;
flex-shrink:0;
transition:.15s
}
.gear-btn:hover,.gear-btn.act{
color:var(--tx);
background:rgba(158,131,110,.12)
}
.gear-btn svg{
width:15px;
height:15px;
display:block
}
.panel{
display:none;
margin-top:8px;
max-width:420px;
width:100%;
background:var(--in);
border:1px solid var(--bd);
border-radius:12px;
padding:11px;
flex-direction:column;
gap:8px;
flex-shrink:0
}
.panel.open{display:flex}
.grid2{
display:flex;
gap:8px;
flex-wrap:wrap
}
.field{
flex:1 1 150px;
min-width:0;
display:flex;
flex-direction:column;
gap:4px
}
.lb{
font-size:11px;
color:var(--mt)
}
.in,.sel{
width:100%;
min-width:0;
background:var(--s);
border:1px solid var(--bd);
border-radius:8px;
padding:6px 8px;
font-size:12px;
color:var(--tx);
outline:none;
font-family:inherit
}
.in:focus,.sel:focus{border-color:var(--g3)}
.in::placeholder{color:var(--mt)}
.foot{
display:flex;
align-items:center;
justify-content:space-between;
gap:8px;
flex-wrap:wrap;
margin-top:2px
}
.msg{font-size:11px;color:var(--ac)}
.act-row{display:flex;gap:6px;align-items:center}
.clr-btn{
background:rgba(201,122,114,.14);
border:1px solid rgba(201,122,114,.35);
color:var(--dn);
font-size:11px;
padding:5px 9px;
border-radius:7px;
cursor:pointer
}
.save-btn{
background:var(--g2);
border:1px solid var(--g3);
color:#f3f1ed;
font-size:11.5px;
padding:5px 12px;
border-radius:7px;
cursor:pointer
}
.save-btn:hover{background:var(--g3)}
.frame-wrap{
display:none;
margin-top:8px;
flex:1 1 auto;
min-height:0;
width:100%;
border-radius:10px;
overflow:hidden;
border:1px solid var(--bd);
background:var(--in)
}
.frame-wrap.open{display:block}
.frame-wrap iframe{
width:100%;
height:100%;
border:none;
display:block;
background:transparent
}
</style>
</head>
<body>
<div class="root" id="root">
<div class="row-top">
<div class="btn-wrap" id="btnWrap">
<button class="ebtn" id="launchBtn" type="button">Embed link</button>
<span class="rh rh-r" data-dir="r" title="Drag width"></span>
<span class="rh rh-b" data-dir="b" title="Drag height"></span>
<span class="rh rh-br" data-dir="br" title="Drag width & height"></span>
</div>
<button class="gear-btn" id="gearBtn" type="button" title="Settings" aria-label="Settings">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
<circle cx="12" cy="12" r="3"/>
<path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
</svg>
</button>
</div>

<div class="panel" id="panel">
<div class="grid2">
<div class="field">
<label class="lb" for="labelInput">Button label</label>
<input class="in" id="labelInput" type="text" placeholder="Embed link"/>
</div>
<div class="field">
<label class="lb" for="urlInput">URL</label>
<input class="in" id="urlInput" type="url" placeholder="https://..."/>
</div>
</div>
<div class="grid2">
<div class="field">
<label class="lb" for="modeSelect">Action</label>
<select class="sel" id="modeSelect">
<option value="tab">Open in new tab</option>
<option value="embed">Toggle inline embed</option>
</select>
</div>
</div>
<div class="foot">
<span class="msg" id="msg">Drag button edges to resize</span>
<div class="act-row">
<button class="clr-btn" id="clearBtn" type="button">Reset</button>
<button class="save-btn" id="saveBtn" type="button">Save</button>
</div>
</div>
</div>

<div class="frame-wrap" id="frameWrap">
<iframe id="embedFrame" loading="lazy" referrerpolicy="no-referrer-when-downgrade" allowfullscreen></iframe>
</div>
</div>

<script>
const STORAGE_KEY="book_nook_embed_btn_v2";
const $=id=>document.getElementById(id);

const DEFAULT_STATE={
label:"Embed link",
url:"",
mode:"tab",
embedOpen:false,
width:150,
height:36
};

let state={...DEFAULT_STATE};

function loadState(){
try{
const raw=localStorage.getItem(STORAGE_KEY);
if(!raw)return;
const p=JSON.parse(raw);
if(p&&typeof p==="object"){
state={
label:typeof p.label==="string"&&p.label.trim()?p.label.trim():"Embed link",
url:typeof p.url==="string"?p.url.trim():"",
mode:p.mode==="embed"?"embed":"tab",
embedOpen:Boolean(p.embedOpen),
width:typeof p.width==="number"&&p.width>=68?Math.min(p.width,600):150,
height:typeof p.height==="number"&&p.height>=26?Math.min(p.height,140):36
};
}
}catch(e){}
}

function saveState(){
try{
localStorage.setItem(STORAGE_KEY,JSON.stringify(state));
}catch(e){}
}

function normalizeUrl(raw){
const v=String(raw||"").trim();
if(!v)return"";
if(/^https?:\/\//i.test(v))return v;
if(/^[a-zA-Z0-9.-]+\.[a-zA-Z]{2,}/.test(v))return"https://"+v;
return"";
}

function applyButtonSize(){
const btn=$("launchBtn");
btn.style.width=state.width+"px";
btn.style.height=state.height+"px";
const fontSize=Math.max(11.5,Math.min(20,Math.round(state.height*0.38)));
btn.style.fontSize=fontSize+"px";
}

function updateLayoutAlignment(){
const expanded=$("panel").classList.contains("open")||$("frameWrap").classList.contains("open");
$("root").classList.toggle("has-expanded",expanded);
}

function render(){
const btn=$("launchBtn");
btn.textContent=state.label||"Embed link";
applyButtonSize();

const showFrame=state.mode==="embed"&&state.embedOpen&&Boolean(state.url);
$("frameWrap").classList.toggle("open",showFrame);
if(showFrame){
if($("embedFrame").src!==state.url)$("embedFrame").src=state.url;
}else{
$("embedFrame").src="about:blank";
}
updateLayoutAlignment();
}

function openPanel(){
$("labelInput").value=state.label;
$("urlInput").value=state.url;
$("modeSelect").value=state.mode;
$("msg").textContent="Drag button edges to resize";
$("panel").classList.add("open");
$("gearBtn").classList.add("act");
$("btnWrap").classList.add("editing");
updateLayoutAlignment();
$("labelInput").focus();
}

function closePanel(){
$("panel").classList.remove("open");
$("gearBtn").classList.remove("act");
$("btnWrap").classList.remove("editing");
updateLayoutAlignment();
}

// Перетягування меж самої кнопки у режимі налаштування
let dragCtx=null;
document.querySelectorAll(".rh").forEach(handle=>{
handle.addEventListener("pointerdown",e=>{
if(!$("btnWrap").classList.contains("editing"))return;
e.preventDefault();
e.stopPropagation();
handle.setPointerCapture(e.pointerId);
const rect=$("launchBtn").getBoundingClientRect();
dragCtx={
dir:handle.dataset.dir,
startX:e.clientX,
startY:e.clientY,
startW:rect.width,
startH:rect.height
};
});

handle.addEventListener("pointermove",e=>{
if(!dragCtx)return;
const maxW=Math.max(68,window.innerWidth-56);
if(dragCtx.dir==="r"||dragCtx.dir==="br"){
state.width=Math.round(Math.max(68,Math.min(maxW,dragCtx.startW+(e.clientX-dragCtx.startX))));
}
if(dragCtx.dir==="b"||dragCtx.dir==="br"){
state.height=Math.round(Math.max(26,Math.min(140,dragCtx.startH+(e.clientY-dragCtx.startY))));
}
applyButtonSize();
});

const endDrag=()=>{
if(!dragCtx)return;
dragCtx=null;
saveState();
};
handle.addEventListener("pointerup",endDrag);
handle.addEventListener("pointercancel",endDrag);
});

$("launchBtn").onclick=()=>{
if(dragCtx)return;
if(!state.url){
openPanel();
$("msg").textContent="Add a URL first.";
return;
}
if(state.mode==="tab"){
window.open(state.url,"_blank","noopener,noreferrer");
}else{
state.embedOpen=!state.embedOpen;
saveState();
render();
}
};

$("gearBtn").onclick=()=>{
if($("panel").classList.contains("open"))closePanel();
else openPanel();
};

$("saveBtn").onclick=()=>{
const nextLabel=$("labelInput").value.trim()||"Embed link";
const nextUrl=normalizeUrl($("urlInput").value);
if($("urlInput").value.trim()&&!nextUrl){
$("msg").textContent="Invalid URL.";
return;
}
state.label=nextLabel;
state.url=nextUrl;
state.mode=$("modeSelect").value==="embed"?"embed":"tab";
if(!state.url||state.mode!=="embed")state.embedOpen=false;
saveState();
render();
closePanel();
};

$("clearBtn").onclick=()=>{
state={...DEFAULT_STATE};
saveState();
render();
openPanel();
$("msg").textContent="Reset.";
};

loadState();
render();
</script>
</body>
</html>
